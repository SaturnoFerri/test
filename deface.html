<body>   
    <img src="https://imgs.search.brave.com/-svekV0Bs0HlbFbckc9M9RYIp3MRj-9TRgSsFKtvTzE/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tZWRp/YS50ZW5vci5jb20v/cUJReHd2cDhEMVVB/QUFBTS9oYWNrZXIt/bWVtZS5naWY.gif" alt="Hacked" style="display: block; width: 50%; height: auto; margin: 0 auto;">
    <h1>Hacked OK</h1>
    <style>
        body {
            background-color: black;
        }
        h1 {
            color: green;
            text-align: center;
            font-size: 3em;
            margin-top: 20px;
        }
    </style>
    <canvas id="matrix"></canvas>

<style>
  #matrix {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: black;
    z-index: -1;
  }
</style>

<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

canvas.width = innerWidth;
canvas.height = innerHeight;

const chars = '01';
const fontSize = 16;
const columns = Math.floor(canvas.width / fontSize);
const drops = Array(columns).fill(1);

function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0f0';
  ctx.font = fontSize + 'px monospace';

  for (let i = 0; i < drops.length; i++) {
    const char = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(char, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}

setInterval(draw, 50);

window.addEventListener('resize', () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});
</script>   
</body>
